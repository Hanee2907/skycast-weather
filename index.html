<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCast - Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="clear-day">

  <!-- Animated weather layer (sun, clouds, rain, snow) -->
  <div id="sky">
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div id="rain"></div>
    <div id="snow"></div>
    <div class="flash"></div>
  </div>

  <div class="container">

    <!-- Header with search -->
    <header>
      <h1 class="logo">☁️ SkyCast</h1>

      <form id="search-form" autocomplete="off">
        <input type="text" id="city-input" placeholder="Search a city... e.g. London" aria-label="City name">
        <button type="submit" class="btn">Search</button>
        <button type="button" id="location-btn" class="btn btn-icon" title="Use my location">📍</button>
      </form>

      <button id="unit-btn" class="btn unit-btn" title="Switch °C / °F">°C</button>
    </header>

    <!-- Recently searched cities -->
    <div id="recent"></div>

    <!-- Messages -->
    <p id="message"></p>

    <!-- Loading spinner -->
    <div id="loader" class="hidden">
      <div class="spinner"></div>
      <p>Getting the weather...</p>
    </div>

    <main id="dashboard" class="hidden">

      <!-- Big current weather card -->
      <section class="card current">
        <div>
          <h2 id="city-name">City</h2>
          <p id="date-time" class="muted">Date</p>
          <div class="temp-row">
            <span id="current-icon" class="big-icon">☀️</span>
            <span id="current-temp" class="big-temp">--°</span>
          </div>
          <p id="current-desc" class="desc">Clear sky</p>
          <p class="muted">
            H: <span id="temp-max">--</span> &nbsp; L: <span id="temp-min">--</span>
          </p>
        </div>
      </section>

      <!-- Small detail cards -->
      <section class="details">
        <div class="card mini">
          <p class="label">🌡️ Feels like</p>
          <p class="value" id="feels-like">--</p>
        </div>
        <div class="card mini">
          <p class="label">💧 Humidity</p>
          <p class="value" id="humidity">--</p>
        </div>
        <div class="card mini">
          <p class="label">💨 Wind</p>
          <p class="value" id="wind">--</p>
        </div>
        <div class="card mini">
          <p class="label">🔆 UV index</p>
          <p class="value" id="uv">--</p>
        </div>
        <div class="card mini">
          <p class="label">🌅 Sunrise</p>
          <p class="value" id="sunrise">--</p>
        </div>
        <div class="card mini">
          <p class="label">🌇 Sunset</p>
          <p class="value" id="sunset">--</p>
        </div>
      </section>

      <!-- Hourly forecast -->
      <section class="card">
        <h3>Next 24 hours</h3>
        <div id="hourly" class="hourly"></div>
      </section>

      <!-- 7 day forecast -->
      <section class="card">
        <h3>7-day forecast</h3>
        <div id="daily"></div>
      </section>

    </main>

    <footer>
      Made with HTML, CSS &amp; JavaScript · Weather data from
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
